# WEB-02 / WEB-03: the beta forum's checks. This repository is public, so the
# runs cost nothing.
#   pgtap: a throwaway supabase/postgres container, supabase/migrations applied,
#          supabase/tests run with pgTAP, plus the read-only and race probes.
#   site:  no legal page ships an unfilled date, the three pages share one
#          version, and the forum's address and its CSP agree.
name: Forum tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/test-forum.sh'
      - 'scripts/check-site-texts.sh'
      - 'forum/**'
      - 'privacy/**'
      - 'cookies/**'
      - 'terms/**'
      - '.github/workflows/forum-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the forum pgTAP suite
        run: bash scripts/test-forum.sh

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the legal pages and the forum's switch
        run: bash scripts/check-site-texts.sh
