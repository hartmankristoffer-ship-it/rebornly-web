<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://wzvmdfvheoenuucmizfy.supabase.co https://cavjsnlmktsjlofhokkg.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
  <title>Rebornly — Set a new password</title>
  <link rel="icon" type="image/png" href="/assets/branding/favicon2.png">
  <style>
    /* The app's brown palette (Design Lab tokens, lib/design_system/tokens/rc_colors.dart). */
    :root{
      color-scheme:light;
      --ground:#f9f5ef;--card:#fbf7f4;--text:#1c1a18;--heading:#2b211b;--muted:#6b6763;
      --line:#e6dfd7;--on-fill:#2a211d;--fill-a:#f3eae0;--fill-b:#e5d6c6;
      --error:#9a3f45;--error-fill:#f7e7e7;--shadow:rgba(90,61,56,.09);
      --serif:"Noto Serif","DM Serif Display",Georgia,"Times New Roman",serif;
      --sans:Inter,Roboto,"Helvetica Neue",Arial,system-ui,-apple-system,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{background:var(--ground)}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:var(--sans);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
    main{width:min(100%,460px)}
    .brand{display:flex;justify-content:center;margin-bottom:20px}
    .brand img{width:135px;height:auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 12px 40px var(--shadow)}
    h1{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:1.75rem;color:var(--heading)}
    p{margin:0;color:var(--muted)}
    label{display:block;margin:20px 0 6px;font-weight:600;color:var(--heading)}
    input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);font:inherit}
    input:focus{outline:2px solid var(--fill-b);outline-offset:1px}
    button{width:100%;margin-top:24px;padding:14px 16px;border:0;border-radius:14px;font:inherit;font-weight:600;color:var(--on-fill);background:linear-gradient(152deg,var(--fill-a),var(--fill-b));cursor:pointer}
    button[disabled]{opacity:.6;cursor:default}
    .hint{margin-top:6px;font-size:.9rem}
    #status{margin-top:18px;min-height:1.5em}
    #status.error{padding:12px 14px;border-radius:12px;background:var(--error-fill);color:var(--error)}
    #status.done{color:var(--heading)}
  </style>
</head>
<body>
<main>
  <div class="brand"><img src="/assets/branding/rebornly_logo.png" alt="Rebornly"></div>
  <div class="card">
    <h1>Set a new password</h1>
    <p id="intro">Choose a new password for your Rebornly account.</p>
    <form id="form" autocomplete="off" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" minlength="15" required autocomplete="new-password">
      <p class="hint">At least 15 characters.</p>
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="15" required autocomplete="new-password">
      <button id="submit" type="submit">Update password</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
</main>
<script>
(() => {
  // AUTH-RESET-01 (Rebornly issue #184). Two kinds of recovery link reach this page:
  //  * the current one, from each project's "Reset password" email template:
  //      /r/AUTH-06/?token_hash=<hash>&type=recovery&project=<project ref>
  //    The hash is verified (POST /auth/v1/verify) only when the member submits
  //    a new password, so a mail scanner that opens the link never spends it.
  //  * the older one, still in members' inboxes during the switch:
  //      /r/AUTH-06#access_token=<jwt>&type=recovery
  // Each project's public URL and publishable key only. No token is ever written
  // to the console, to storage, or into any request but the auth server's own.
  const configs = {
    wzvmdfvheoenuucmizfy: {
      url: 'https://wzvmdfvheoenuucmizfy.supabase.co',
      key: 'sb_publishable_WD8mivYsYDdZgByq6TYISQ_KbnVA75E'
    },
    cavjsnlmktsjlofhokkg: {
      url: 'https://cavjsnlmktsjlofhokkg.supabase.co',
      key: 'sb_publishable_lOCqm6RehtIJ8OwgLbTkDg_lnXoUWg-'
    }
  };
  const MIN_LENGTH = 15; // the app's rule and supabase/config.toml minimum_password_length
  const INVALID = 'This recovery link is invalid or has expired. Request a new password reset email from the Rebornly app.';
  const UNKNOWN = 'This recovery link does not belong to a recognized Rebornly environment. Request a new password reset email from the Rebornly app.';

  const query = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : '');
  // Take the token out of the address bar and the history at once.
  history.replaceState(null, '', location.pathname);

  const form = document.getElementById('form');
  const status = document.getElementById('status');
  const submit = document.getElementById('submit');

  function say(message, kind) {
    status.textContent = message;
    status.className = kind || '';
  }
  function fail(message) {
    form.hidden = true;
    say(message, 'error');
  }
  function projectFromJwt(token) {
    try {
      const part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const padded = part + '='.repeat((4 - part.length % 4) % 4);
      const payload = JSON.parse(decodeURIComponent(Array.from(atob(padded), c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')));
      const issuer = String(payload.iss || '');
      return Object.keys(configs).find(ref => issuer.includes(ref)) || null;
    } catch (_) {
      return null;
    }
  }
  function known(ref) {
    return Boolean(ref) && Object.prototype.hasOwnProperty.call(configs, ref);
  }

  // Which link is this?
  let config = null;
  let tokenHash = null;
  let accessToken = null;
  if (query.has('token_hash')) {
    tokenHash = query.get('token_hash');
    const ref = query.get('project');
    if (!tokenHash || query.get('type') !== 'recovery') return fail(INVALID);
    if (!known(ref)) return fail(UNKNOWN);
    config = configs[ref];
  } else if (hash.has('access_token')) {
    accessToken = hash.get('access_token');
    const type = hash.get('type');
    if (!accessToken || (type && type !== 'recovery')) return fail(INVALID);
    const ref = projectFromJwt(accessToken);
    if (!known(ref)) return fail(UNKNOWN);
    config = configs[ref];
  } else {
    // An error the auth server put on the link, a ?code= from a reset the
    // app requested before this change, or no token at all.
    return fail(INVALID);
  }
  form.hidden = false;

  async function call(path, method, bearer, body) {
    const headers = { apikey: config.key, 'Content-Type': 'application/json' };
    if (bearer) headers.Authorization = 'Bearer ' + bearer;
    const response = await fetch(config.url + path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body),
      credentials: 'omit',
      cache: 'no-store',
      referrerPolicy: 'no-referrer'
    });
    const json = await response.json().catch(() => ({}));
    return { ok: response.ok, json };
  }

  let busy = false;
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password.length < MIN_LENGTH) return say('Use at least ' + MIN_LENGTH + ' characters.', 'error');
    if (password !== confirm) return say('The passwords do not match.', 'error');

    busy = true;
    submit.disabled = true;
    say('Updating your password…');
    try {
      // The recovery session: from the token hash, spent once here, or the
      // older link's own.
      if (tokenHash) {
        const verified = await call('/auth/v1/verify', 'POST', null, { type: 'recovery', token_hash: tokenHash });
        tokenHash = null; // answered: spent or refused, never sent twice
        accessToken = verified.ok ? verified.json.access_token || null : null;
        if (!accessToken) return fail(INVALID);
      }

      const updated = await call('/auth/v1/user', 'PUT', accessToken, { password });
      if (!updated.ok) {
        const reason = updated.json.error_code || '';
        if (reason === 'weak_password') {
          say('Choose a stronger password of at least ' + MIN_LENGTH + ' characters.', 'error');
        } else if (reason === 'same_password') {
          say('Choose a password you have not used for this account before.', 'error');
        } else {
          fail(INVALID);
        }
        return;
      }

      // Every device signs in again with the new password.
      try { await call('/auth/v1/logout?scope=global', 'POST', accessToken); } catch (_) {}
      accessToken = null;
      form.hidden = true;
      document.getElementById('intro').hidden = true;
      say('Password updated. You can now return to Rebornly and sign in.', 'done');
    } catch (_) {
      say('Rebornly can’t be reached right now. Check your connection and try again.', 'error');
    } finally {
      busy = false;
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
