<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beta forum — Rebornly</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <!-- WEB-02. connect-src stays 'none' while the forum is off. Switching it on
       sets FORUM_URL and FORUM_KEY in config.js and puts the project's origin
       in connect-src here; see docs/forum/RUNBOOK.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The closed forum for people invited to the Rebornly beta.">
  <meta name="theme-color" content="#f8f5f0">
  <link rel="icon" type="image/png" href="/assets/branding/favicon2.png">
  <link rel="stylesheet" href="/forum/forum.css">
</head>
<body>
  <header class="site-header">
    <div class="shell">
      <a href="/"><img src="/assets/branding/rebornly_logo.png" alt="Rebornly" width="539" height="160"></a>
    </div>
  </header>

  <main>
    <div class="shell">
      <div id="bar" class="bar" hidden></div>
      <div id="app" aria-live="polite">
        <h1>Beta forum</h1>
        <p>The forum needs JavaScript to work.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="shell">
      <img src="/assets/branding/rebornly_logo.png" alt="Rebornly" width="539" height="160">
      <nav class="footer-links" aria-label="Site documents">
        <a href="#/rules">Forum rules</a>
        <span aria-hidden="true">&middot;</span>
        <a href="#/notice">Report illegal content</a>
        <span aria-hidden="true">&middot;</span>
        <a href="/privacy/">Privacy</a>
        <span aria-hidden="true">&middot;</span>
        <a href="/terms/">Terms</a>
        <span aria-hidden="true">&middot;</span>
        <a href="/cookies/">Cookies</a>
        <span aria-hidden="true">&middot;</span>
        <a href="/contact/">Contact</a>
      </nav>
      <p class="copyright">&copy; 2026 Rebornly</p>
    </div>
  </footer>

  <script src="/forum/config.js"></script>
  <script src="/forum/forum.js"></script>
</body>
</html>
