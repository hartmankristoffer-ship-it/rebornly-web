<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Rebornly</title>
  <script>
    (() => {
      const hashParams = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : '');
      const queryParams = new URLSearchParams(location.search);
      const type = hashParams.get('type') || queryParams.get('type');
      const accessToken = hashParams.get('access_token');

      if (type === 'recovery') {
        location.replace('/r/AUTH-06' + location.hash);
        return;
      }

      if (type === 'signup' || type === 'email') {
        location.replace('/r/AUTH-03' + location.hash);
        return;
      }

      window.__REBORNLY_AUTH_FALLBACK__ = Boolean(accessToken);
    })();
  </script>
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101010;color:#f5f1ee}
    main{width:min(92vw,540px)}
    .card{background:#191919;border:1px solid #333;border-radius:20px;padding:30px;box-shadow:0 18px 60px rgba(0,0,0,.3)}
    h1{margin:0 0 10px}
    p{color:#c9c3bf;line-height:1.55}
    button{width:100%;margin-top:18px;padding:14px 16px;border:0;border-radius:12px;font-weight:750;cursor:pointer}
    #fallback{display:none}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Rebornly</h1>
    <p id="normal">This domain is used for secure Rebornly account links and app deep links.</p>
    <div id="fallback">
      <p>A secure Rebornly account session is active. If you requested a password reset, continue below.</p>
      <button id="continueRecovery" type="button">Continue password reset</button>
    </div>
  </div>
</main>
<script>
(() => {
  if (!window.__REBORNLY_AUTH_FALLBACK__) return;
  document.getElementById('normal').style.display = 'none';
  document.getElementById('fallback').style.display = 'block';
  document.getElementById('continueRecovery').addEventListener('click', () => {
    location.replace('/r/AUTH-06' + location.hash);
  });
})();
</script>
</body>
</html>
