<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Rebornly</title>
  <script>
    (() => {
      if (!location.hash) return;
      const hash = new URLSearchParams(location.hash.slice(1));
      const type = hash.get('type');

      if (type === 'recovery') {
        location.replace('/r/AUTH-06' + location.hash);
        return;
      }

      if (type === 'signup') {
        location.replace('/r/AUTH-03' + location.hash);
      }
    })();
  </script>
  <style>
    :root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101010;color:#f5f1ee}main{width:min(92vw,540px)}.card{background:#191919;border:1px solid #333;border-radius:20px;padding:30px}h1{margin:0 0 10px}p{color:#c9c3bf;line-height:1.55}
  </style>
</head>
<body><main><div class="card"><h1>Rebornly</h1><p>This domain is used for secure Rebornly account links and app deep links.</p></div></main></body>
</html>
